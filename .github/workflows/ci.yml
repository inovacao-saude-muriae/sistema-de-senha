name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: false
    name: Lint, tipos e testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # `next typegen` roda antes do lint type-aware para gerar os tipos de
      # rota que o tsconfig referencia.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Lint type-aware
        run: bun run lint:type-aware

      - name: Formatação
        run: bun run format:check

      - name: Testes unitários
        run: bun run test:unit
